# cronサービス（dualrun-reconciler）用のconfig-as-code。
#
# ⚠️ **2026-09-06 時点、このファイルは読まれていない。**
# 対象サービスの Config-as-code にファイルパスが設定されておらず、
# Railwayは2026-08-28以降に作られたサービスのopt-inを認めていない。
# 有効になるのは、ダッシュボードでこのパスを明示的に指定した場合だけ。
#
# 経緯: 2026-09-05 に一度、照合スクリプトではなくHTTPサーバーとして
# 起動した実行があった（Dockerfileの既定CMD）。当初このファイルの削除が
# 原因と説明したが、**それは根拠のない推測だった**——参照されていない
# ファイルの有無が挙動を変えることはない。原因は未特定のまま。
#
# 残してある理由は、将来パスを指定する運用に切り替えるときに
# 正しい起動コマンドと再試行方針がすぐ使えるようにするため。
# 起動コマンドの実効的な設定はダッシュボードの Custom Start Command 側。

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node scripts/dualrun-reconcile.mjs"
# 不一致検出(exit 1)も記録先なし(exit 3)も、再実行すれば同じ結果になる。
# リトライで隠さず、失敗として残す
restartPolicyType = "never"
