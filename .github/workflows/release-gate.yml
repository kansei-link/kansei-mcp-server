# P0 #39: リリースゲート（CI・検証のみ）
# v* タグの push 時に release-gate を実行して「このタグから publish してよいか」を判定する。
# ⚠️ publish 自体はこのワークフローでは実行しない — npm publish は常に
#    pack-gate PASS → release-gate PASS → Michie L3承認 → 手動実行 の順（NPM_TOKEN も置かない）。
name: release-gate
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # タグとHEADの一致検証にタグ実体が必要
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: release-gate (clean worktree + tag@HEAD + pack-gate + route-gate)
        run: node scripts/release-gate.mjs
