name: Reconnaissance Ant

# Daily crawl of all Synapse Arrows products from inside KanseiLINK MCP.
# See scripts/reconnaissance/README.md
# Pattern: https://github.com/michielinksee/synapse-arrows-playbook/blob/main/02-process/reconnaissance-ant.md
#
# 2026-10-23 security hardening v1 (founder-ops/research/Disclosure_2026-10):
#   - No longer commits or pushes to main. The daily report, baselines, diff images and the linksee
#     queue are uploaded as an Actions artifact kept for 14 days. A push to main from a bot was the
#     same shape that triggered the 10/04 production outage, and it put screenshots of other
#     companies' sites into the public repo every day.
#   - permissions: contents: read (nothing is written back to the repo).
#   - The manual `product` input reaches the script through an environment variable, not by
#     interpolating it into the shell script.
#   - Actions are pinned to commit SHAs.
# Baselines: the job still reads the baselines already committed under data/reconnaissance/baselines
# (from the checkout). New baselines are in the artifact; to adopt them, a person downloads the
# artifact and commits them (or the folder moves to the private repo — see the disclosure design).

on:
  schedule:
    # 00:00 UTC = 09:00 JST. Daily.
    - cron: "0 0 * * *"
  workflow_dispatch:
    # Manual trigger for testing or ad-hoc runs.
    inputs:
      product:
        description: "Single product to monitor (e.g. scanavi). Leave empty for all."
        required: false
        type: string

permissions:
  contents: read

jobs:
  reconnaissance:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cache hit case)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run reconnaissance
        id: recon
        continue-on-error: true
        env:
          RECON_PRODUCT: ${{ github.event.inputs.product }}
        run: |
          if [ -n "$RECON_PRODUCT" ]; then
            node scripts/reconnaissance/run.mjs "--product=$RECON_PRODUCT"
          else
            node scripts/reconnaissance/run.mjs
          fi

      - name: Date for the artifact name
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Keep the report as an artifact (14 days, not committed)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reconnaissance-${{ steps.date.outputs.date }}
          path: |
            data/reconnaissance/reports/
            data/reconnaissance/baselines/
            data/reconnaissance/diffs/
            data/reconnaissance/linksee-queue.jsonl
          if-no-files-found: warn
          retention-days: 14

      - name: Fail step if recon detected critical findings
        if: steps.recon.outcome == 'failure'
        run: |
          echo "::warning::Reconnaissance ant detected CRITICAL findings — see today's report artifact"
          exit 1
